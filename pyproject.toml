[project]
name = "rag-research-engine"
version = "2.0.0"
description = "Retrieval-augmented question answering over your own documents, with a reproducible benchmark."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Keylor Pineda" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.28",
    "pdfplumber>=0.11.4",
    "python-multipart>=0.0.18",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.14",
]

[project.optional-dependencies]
local = [
    "fastembed>=0.5",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "numpy>=2.0",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "respx>=0.22",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N", "S", "PT"]
ignore = ["PLR0913", "S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S105", "S106"]
# Migrations interpolate the vector dimension, an int from the settings.
"migrations/**" = ["S608"]
# SVG templates: long markup lines and drawing coordinates.
"docs/assets/build.py" = ["E501", "PLR0917", "PLR2004", "RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pdfplumber.*", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs a running Postgres with pgvector (DATABASE_URL)",
    "model: downloads and runs the local embedding model",
]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
skip_covered = true
show_missing = true
