<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="RAG Research Engine">
<style>
  text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;fill:#E6EDF3}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .muted{fill:#8B98A5}

  .doc{fill:#151B23;stroke:#2D3742;stroke-width:1.5}
  .line{fill:#2D3742}
  .hit{fill:#0E2A28;stroke:#2DD4BF;stroke-width:2;opacity:0;animation:hit 6s infinite}
  .badge{opacity:0;animation:hit 6s infinite}
  .h2{animation-delay:.4s} .h3{animation-delay:.8s}
  @keyframes hit{0%,30%{opacity:0}40%,85%{opacity:1}100%{opacity:0}}
  .scan{animation:scan 6s infinite}
  @keyframes scan{0%{transform:translateY(0);opacity:0}5%{opacity:.9}35%{transform:translateY(150px);opacity:.9}40%,100%{opacity:0;transform:translateY(150px)}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}.traveler{display:none}}
</style>
<rect x=".5" y=".5" width="1199" height="299" rx="20" fill="#0D1117" stroke="#2D3742"/>

<text x="64" y="118" font-size="44" font-weight="800">RAG Research Engine</text>
<text x="66" y="160" font-size="20" class="muted">Answers from your documents, with sources you can check,</text>
<text x="66" y="188" font-size="20" class="muted">and a clear “I don't know” when the evidence is not there.</text>
<g font-size="14" font-weight="600">
  <rect x="66" y="218" width="150" height="32" rx="16" fill="#0E2A28"/><text x="141" y="239" text-anchor="middle" style="fill:#2DD4BF">pgvector + HNSW</text>
  <rect x="226" y="218" width="130" height="32" rx="16" fill="#132239"/><text x="291" y="239" text-anchor="middle" style="fill:#60A5FA">hybrid · RRF</text>
  <rect x="366" y="218" width="170" height="32" rx="16" fill="#2C1A0E"/><text x="451" y="239" text-anchor="middle" style="fill:#FB923C">abstains, measured</text>
</g>
