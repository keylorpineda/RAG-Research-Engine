<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-label="Abstention threshold trade-off">
<style>
  text{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif;fill:#0E1D1C}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .muted{fill:#55676A}

  .ln{fill:none;stroke-width:3;stroke-linejoin:round;stroke-dasharray:2000;stroke-dashoffset:2000;animation:draw 2.4s ease-out forwards}
  .l2{animation-delay:.4s}
  @keyframes draw{to{stroke-dashoffset:0}}
  .mark{opacity:0;animation:show .6s 2.2s forwards}
  @keyframes show{to{opacity:1}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}.traveler{display:none}}
</style>
<rect x=".5" y=".5" width="1199" height="369" rx="20" fill="#FFFFFF" stroke="#D9E4E2"/>

