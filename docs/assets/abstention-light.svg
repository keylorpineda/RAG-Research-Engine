<rect x="760" y="58" width="14" height="14" rx="3" fill="#C2410C"/><text x="780" y="70" font-size="14">unanswerable questions refused</text>
<line x1="110" x2="950" y1="300.0" y2="300.0" stroke="#E7EEED"/><text x="98" y="305.0" text-anchor="end" font-size="12" class="muted">0%</text><line x1="110" x2="950" y1="245.0" y2="245.0" stroke="#E7EEED"/><text x="98" y="250.0" text-anchor="end" font-size="12" class="muted">25%</text><line x1="110" x2="950" y1="190.0" y2="190.0" stroke="#E7EEED"/><text x="98" y="195.0" text-anchor="end" font-size="12" class="muted">50%</text><line x1="110" x2="950" y1="135.0" y2="135.0" stroke="#E7EEED"/><text x="98" y="140.0" text-anchor="end" font-size="12" class="muted">75%</text><line x1="110" x2="950" y1="80.0" y2="80.0" stroke="#E7EEED"/><text x="98" y="85.0" text-anchor="end" font-size="12" class="muted">100%</text><text x="110.0" y="324" text-anchor="middle" font-size="12" class="muted">0.2</text><text x="278.0" y="324" text-anchor="middle" font-size="12" class="muted">0.3</text><text x="446.0" y="324" text-anchor="middle" font-size="12" class="muted">0.4</text><text x="614.0" y="324" text-anchor="middle" font-size="12" class="muted">0.5</text><text x="782.0" y="324" text-anchor="middle" font-size="12" class="muted">0.6</text><text x="950.0" y="324" text-anchor="middle" font-size="12" class="muted">0.7</text>
