name: Bug report
description: Something does not work as expected
labels: ['type: bug']
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Upload a PDF with `POST /api/upload`
        2. Ask `POST /api/query` with {"q": "..."}
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - API
        - Retrieval and answers
        - Ingestion
        - Database
        - Benchmark
        - Desktop client
        - CI / tooling
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: 'e.g. docker compose on Ubuntu 24.04, EMBEDDING_PROVIDER=local'
  - type: textarea
    id: logs
    attributes:
      label: Logs
      render: shell
