name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # Only superseded PR runs are cancelled: a cancelled push run shows as failing in the badge.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rag -d rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      MODEL_CACHE_DIR: ~/.cache/fastembed
      EMBEDDING_PROVIDER: local
      TEST_DATABASE_URL: postgresql://rag:rag@localhost:5433/rag_test

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Cache embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ hashFiles('app/providers/embeddings.py') }}

      - name: Install
        run: uv sync --frozen --all-extras

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run mypy

      - name: Test
        run: uv run pytest --cov --cov-report=term
