name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      # PR titles become the squash commit, so they follow Conventional Commits too.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            refactor
            perf
            test
            build
            ci
            chore
            revert
          scopes: |
            api
            retrieval
            ingestion
            db
            eval
            web
            deploy
            deps
            deps-dev
            ci
            repo
            release
          requireScope: false
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: 'The subject "{subject}" must start lowercase and not end with a period.'
