version: 2
updates:
  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels: ['type: dependencies']
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    labels: ['type: dependencies', 'area: ci']
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    labels: ['type: dependencies']
    commit-message:
      prefix: chore
      include: scope
