services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    # Migrations run before the API starts; they are idempotent.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ragdb
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  worker:
    build: .
    command: python -m app.worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ragdb
    depends_on:
      api:
        condition: service_started
    volumes:
      - uploads:/app/uploads
    # Scale with: docker compose up --scale worker=3
    stop_grace_period: 30s

volumes:
  pg_data:
  uploads:
