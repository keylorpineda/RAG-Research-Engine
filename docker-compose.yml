services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: ragdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ragdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    # The entrypoint applies migrations (idempotent) before the API starts.
    command: api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ragdb
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads
      - models:/app/models

  worker:
    build: .
    command: worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ragdb
    depends_on:
      api:
        condition: service_started
    volumes:
      - uploads:/app/uploads
      - models:/app/models
    # Scale with: docker compose up --scale worker=3
    stop_grace_period: 30s

volumes:
  pg_data:
  uploads:
  # The local embedding model, downloaded once and shared by the API and the workers.
  models:
