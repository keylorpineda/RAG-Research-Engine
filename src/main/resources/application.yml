server:
  port: 8080

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ragdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.lob.non_contextual_creation: true
      logging.level.com.rag.service: DEBUG
  flyway:
    enabled: true

app:
  uploadsDir: ${UPLOADS_DIR:uploads}
  gemini:
    apiKey: ${GEMINI_API_KEY:changeme}
    model: gemini-2.0-flash
    maxOutputTokens: 1024
  cohere:
    apiKey: ${COHERE_API_KEY:changeme}
    embeddingModel: embed-multilingual-v3.0
    embeddingInputType: ${COHERE_EMBEDDING_INPUT_TYPE:search_document}
ingestion:
  poll-interval-ms: ${INGESTION_POLL_INTERVAL_MS:2000}
